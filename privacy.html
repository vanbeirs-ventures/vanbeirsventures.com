en:{
 eyebrow:"Legal",
 title:"Privacy Notice — Email Communications",
 updated:"Last updated: 31 August 2026",
 intro:"This notice explains how the Van Beirs group processes personal data when we correspond with you by email. It applies to email communications sent from and received at addresses of the Van Beirs group (including @vanbeirsventures.com). It supplements, and does not replace, the privacy policy published on the vanbeirsventures.com website.",
 s:[
 ["1 · Data controller","Van Beirs Ventures B.V. (Antwerp, Belgium), part of the Van Beirs group headed by Van Beirs Holding B.V., is the controller of personal data processed in connection with its email correspondence. Where another company of the Van Beirs group corresponds with you, that company acts as controller for its own correspondence. For all privacy matters you can contact us at <a href='mailto:legal@vanbeirsventures.com'>legal@vanbeirsventures.com</a>."],
 ["2 · Data we process","When we exchange emails with you, we process: your name and email address; your business contact details (organisation, function, telephone number) where you provide them, for example in a signature block; the content of the correspondence and its attachments; and technical metadata generated by mail systems (such as dates, times and delivery information)."],
 ["3 · Purposes and legal bases","We process this data under Regulation (EU) 2016/679 (GDPR) and the Belgian Act of 30 July 2018 on the protection of natural persons with regard to the processing of personal data, on the following bases:<ul><li>to correspond with you and to respond to your enquiries — our legitimate interest in conducting normal business correspondence (Art. 6(1)(f) GDPR) or steps prior to entering into a contract at your request (Art. 6(1)(b));</li><li>to manage business, investor and supplier relationships — Art. 6(1)(b) and (f);</li><li>to comply with legal obligations that apply to us, including company-law, accounting, tax and, where applicable, financial-regulatory and anti-money-laundering obligations — Art. 6(1)(c);</li><li>to establish, exercise or defend legal claims — Art. 6(1)(f);</li><li>to send newsletters or corporate updates — only with your consent (Art. 6(1)(a)) or, within the limits of Article XII.13 of the Belgian Code of Economic Law, to existing relations for similar services, always with the possibility to unsubscribe in every message.</li></ul>"],
 ["4 · Recipients","Within the limits of the purposes above, personal data may be shared with: other companies of the Van Beirs group; IT and email service providers acting as processors under Art. 28 GDPR; and professional advisers bound by confidentiality. Data is disclosed to public authorities only where the law requires it. We do not sell personal data."],
 ["5 · Transfers outside the EEA","Where correspondence data is transferred outside the European Economic Area (for example because a service provider operates there), we rely on an adequacy decision of the European Commission or on appropriate safeguards such as the EU Standard Contractual Clauses. You may request a copy of the relevant safeguards via <a href='mailto:legal@vanbeirsventures.com'>legal@vanbeirsventures.com</a>."],
 ["6 · Retention","We keep email correspondence no longer than necessary for the purposes described above, and thereafter only as long as statutory retention duties or limitation periods require (for contractual and corporate documentation, in general up to ten years under Belgian law). Data processed for updates or newsletters is kept until you unsubscribe."],
 ["7 · Your rights","You have the right to request access to and rectification or erasure of your personal data, restriction of processing, data portability, and to object to processing based on our legitimate interests. You may object to direct marketing at any time, and withdraw any consent without affecting prior processing. To exercise these rights, contact <a href='mailto:legal@vanbeirsventures.com'>legal@vanbeirsventures.com</a>. You may also lodge a complaint with the Belgian Data Protection Authority (Gegevensbeschermingsautoriteit / Autorité de protection des données), Rue de la Presse 35, 1000 Brussels, <a href='https://www.dataprotectionauthority.be' target='_blank' rel='noopener'>www.dataprotectionauthority.be</a>, or with the supervisory authority of your habitual residence in the EU."],
 ["8 · Confidentiality of our emails","Our email messages and their attachments are confidential and intended solely for the addressee. If you received a message in error, please inform the sender and delete it; any use, disclosure or copying by anyone other than the intended recipient is not permitted."],
 ["9 · Changes to this notice","We may update this notice from time to time. The version published at this address applies. Material changes will be indicated by the date above."]
 ],

 ["4 · Ontvangers","Binnen de grenzen van bovenstaande doeleinden kunnen persoonsgegevens worden gedeeld met: andere vennootschappen van de Van Beirs-groep; IT- en e-maildienstverleners die optreden als verwerkers in de zin van art. 28 AVG; en professionele adviseurs gebonden door vertrouwelijkheid. Gegevens worden enkel aan overheden meegedeeld wanneer de wet dat vereist. Wij verkopen geen persoonsgegevens."],
 ["5 · Doorgiften buiten de EER","Wanneer correspondentiegegevens buiten de Europese Economische Ruimte worden doorgegeven (bijvoorbeeld omdat een dienstverlener daar actief is), steunen wij op een adequaatheidsbesluit van de Europese Commissie of op passende waarborgen zoals de EU-standaardcontractbepalingen. U kunt via <a href='mailto:legal@vanbeirsventures.com'>legal@vanbeirsventures.com</a> een kopie van de relevante waarborgen opvragen."],
 ["6 · Bewaartermijn","Wij bewaren e-mailcorrespondentie niet langer dan nodig voor de hierboven beschreven doeleinden, en daarna enkel zolang wettelijke bewaarplichten of verjaringstermijnen dat vereisen (voor contractuele en vennootschapsdocumentatie in het algemeen tot tien jaar naar Belgisch recht). Gegevens verwerkt voor updates of nieuwsbrieven worden bewaard tot u zich uitschrijft."],
 ["7 · Uw rechten","U hebt het recht om inzage, verbetering of wissing van uw persoonsgegevens te vragen, alsook beperking van de verwerking en gegevensoverdraagbaarheid, en om bezwaar te maken tegen verwerking op grond van ons gerechtvaardigd belang. U kunt zich te allen tijde verzetten tegen direct marketing en elke toestemming intrekken zonder afbreuk aan eerdere verwerking. Om deze rechten uit te oefenen, contacteert u <a href='mailto:legal@vanbeirsventures.com'>legal@vanbeirsventures.com</a>. U kunt ook klacht indienen bij de Gegevensbeschermingsautoriteit, Drukpersstraat 35, 1000 Brussel, <a href='https://www.gegevensbeschermingsautoriteit.be' target='_blank' rel='noopener'>www.gegevensbeschermingsautoriteit.be</a>, of bij de toezichthoudende autoriteit van uw gewone verblijfplaats in de EU."],
 ["8 · Vertrouwelijkheid van onze e-mails","Onze e-mailberichten en bijlagen zijn vertrouwelijk en uitsluitend bestemd voor de geadresseerde. Ontving u een bericht per vergissing, gelieve dan de afzender te verwittigen en het bericht te verwijderen; elk gebruik, elke bekendmaking of kopie door een ander dan de beoogde ontvanger is niet toegestaan."],
 ["9 · Wijzigingen aan deze verklaring","Wij kunnen deze verklaring van tijd tot tijd bijwerken. De op dit adres gepubliceerde versie is van toepassing. Wezenlijke wijzigingen blijken uit de datum bovenaan."]

fr:{

 s:[

 ["2 · Données traitées","Lorsque nous échangeons des e-mails avec vous, nous traitons : vos nom et adresse e-mail ; vos coordonnées professionnelles (organisation, fonction, numéro de téléphone) lorsque vous les communiquez, par exemple dans un bloc de signature ; le contenu de la correspondance et ses pièces jointes ; ainsi que les métadonnées techniques générées par les systèmes de messagerie (dates, heures, informations de remise)."],
 ["3 · Finalités et bases juridiques","Nous traitons ces données conformément au Règlement (UE) 2016/679 (RGPD) et à la loi belge du 30 juillet 2018 relative à la protection des personnes physiques à l'égard des traitements de données à caractère personnel, sur les bases suivantes :<ul><li>correspondre avec vous et répondre à vos demandes — notre intérêt légitime à mener une correspondance professionnelle normale (art. 6.1.f RGPD) ou mesures précontractuelles prises à votre demande (art. 6.1.b) ;</li><li>gérer les relations d'affaires, avec les investisseurs et les fournisseurs — art. 6.1.b et f ;</li><li>respecter nos obligations légales, notamment en droit des sociétés, en matière comptable et fiscale et, le cas échéant, en matière de réglementation financière et de lutte contre le blanchiment — art. 6.1.c ;</li><li>constater, exercer ou défendre des droits en justice — art. 6.1.f ;</li><li>envoyer des lettres d'information ou communications d'entreprise — uniquement avec votre consentement (art. 6.1.a) ou, dans les limites de l'article XII.13 du Code de droit économique belge, aux relations existantes pour des services analogues, avec toujours la possibilité de se désinscrire dans chaque message.</li></ul>"],
 ["4 · Destinataires","Dans les limites des finalités ci-dessus, les données peuvent être partagées avec : d'autres sociétés du groupe Van Beirs ; des prestataires informatiques et de messagerie agissant comme sous-traitants au sens de l'art. 28 RGPD ; et des conseillers professionnels tenus à la confidentialité. Les données ne sont communiquées aux autorités publiques que lorsque la loi l'exige. Nous ne vendons pas de données à caractère personnel."],
 ["5 · Transferts hors EEE","Lorsque des données de correspondance sont transférées en dehors de l'Espace économique européen (par exemple parce qu'un prestataire y opère), nous nous fondons sur une décision d'adéquation de la Commission européenne ou sur des garanties appropriées telles que les clauses contractuelles types de l'UE. Vous pouvez demander copie des garanties pertinentes via <a href='mailto:legal@vanbeirsventures.com'>legal@vanbeirsventures.com</a>."],
 ["6 · Conservation","Nous ne conservons la correspondance par e-mail que le temps nécessaire aux finalités décrites ci-dessus, puis uniquement aussi longtemps que l'exigent les obligations légales de conservation ou les délais de prescription (pour la documentation contractuelle et sociétaire, en général jusqu'à dix ans en droit belge). Les données traitées pour les lettres d'information sont conservées jusqu'à votre désinscription."],
 ["7 · Vos droits","Vous avez le droit de demander l'accès à vos données, leur rectification ou leur effacement, la limitation du traitement et la portabilité des données, ainsi que de vous opposer aux traitements fondés sur notre intérêt légitime. Vous pouvez vous opposer à tout moment au marketing direct et retirer tout consentement sans affecter les traitements antérieurs. Pour exercer ces droits : <a href='mailto:legal@vanbeirsventures.com'>legal@vanbeirsventures.com</a>. Vous pouvez également introduire une réclamation auprès de l'Autorité de protection des données, rue de la Presse 35, 1000 Bruxelles, <a href='https://www.autoriteprotectiondonnees.be' target='_blank' rel='noopener'>www.autoriteprotectiondonnees.be</a>, ou auprès de l'autorité de contrôle de votre résidence habituelle dans l'UE."],
 ["8 · Confidentialité de nos e-mails","Nos messages électroniques et leurs pièces jointes sont confidentiels et destinés exclusivement à leur destinataire. Si vous avez reçu un message par erreur, veuillez en informer l'expéditeur et le supprimer ; toute utilisation, divulgation ou copie par une personne autre que le destinataire prévu est interdite."],

zh:{
 eyebrow:"法律信息",

 s:[
 ["1 · 数据控制者","Van Beirs Ventures B.V.（比利时安特卫普），隶属于以 Van Beirs Holding B.V. 为首的 Van Beirs 集团，是就其电子邮件通信所处理个人数据的控制者。如由 Van Beirs 集团的其他公司与您通信，则该公司就其自身通信担任控制者。有关隐私事宜，请联系 <a href='mailto:legal@vanbeirsventures.com'>legal@vanbeirsventures.com</a>。"],

 ["3 · 处理目的与法律依据","我们依据欧盟《通用数据保护条例》（GDPR，条例 (EU) 2016/679）及比利时2018年7月30日《自然人个人数据处理保护法》处理上述数据，具体依据如下：<ul><li>与您通信并回复您的询问 — 基于我们开展正常业务通信的合法利益（GDPR 第6条第1款(f)项），或应您要求采取的订立合同前措施（第6条第1款(b)项）；</li><li>管理业务、投资者及供应商关系 — 第6条第1款(b)、(f)项；</li><li>履行适用于我们的法律义务，包括公司法、会计、税务义务，以及（如适用）金融监管和反洗钱义务 — 第6条第1款(c)项；</li><li>提起、行使或抗辩法律主张 — 第6条第1款(f)项；</li><li>发送新闻通讯或公司动态 — 仅在获得您同意时（第6条第1款(a)项），或在比利时《经济法典》第XII.13条允许的范围内向现有关系方发送类似服务信息，且每封邮件均可退订。</li></ul>"],

 ["5 · 欧洲经济区以外的数据传输","如通信数据被传输至欧洲经济区以外（例如因服务提供商在该等地区运营），我们将依据欧盟委员会的充分性认定或适当保障措施（如欧盟标准合同条款）进行。您可通过 <a href='mailto:legal@vanbeirsventures.com'>legal@vanbeirsventures.com</a> 索取相关保障措施的副本。"],

 ["8 · 电子邮件的保密性","我们的电子邮件及其附件属于保密信息，仅供收件人使用。如您误收邮件，请通知发件人并删除该邮件；除预期收件人外，任何人不得使用、披露或复制。"],

 ],

function render(code){
  const t=T[code]||T.en;
  document.documentElement.lang=code;
  document.getElementById('main').innerHTML=
    '<div class="eyebrow">'+t.eyebrow+'</div>'+
    '<h1>'+t.title+'</h1>'+
    '<div class="updated">'+t.updated+'</div>'+
    '<div class="intro">'+t.intro+'</div>'+
    t.s.map(x=>'<h2>'+x[0]+'</h2><p>'+x[1]+'</p>').join('')+
    '<div class="ft">'+t.ft+'</div>';
  document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===code));
  try{localStorage.setItem('vb_privacy_lang',code)}catch(e){}
}
const nav=document.getElementById('langs');
LANGS.forEach(([c,l])=>{
  const b=document.createElement('button');
  b.textContent=l;b.dataset.l=c;b.onclick=()=>render(c);
  nav.appendChild(b);
});
let start='en';
try{const q=new URLSearchParams(location.search).get('lang');const s=localStorage.getItem('vb_privacy_lang');
if(q&&T[q])start=q;else if(s&&T[s])start=s;}catch(e){}
render(start);
</script>
